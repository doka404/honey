<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Lipper Gold – wir sind bald für dich da.">
  <title>Lipper Gold – Coming Soon</title>
  <style>
    :root {
      --gold: #ffc52f;
      --gold-light: #ffe86a;
      --orange: #ff9d0a;
      --red: #ed1c24;
      --ink: #090909;
      --muted: #b8b3a7;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: #fff;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(255, 174, 0, .12), transparent 38%),
        radial-gradient(ellipse at 85% 15%, rgba(237, 28, 36, .09), transparent 28%),
        var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .13;
      background-image: radial-gradient(rgba(255,255,255,.45) .65px, transparent .65px);
      background-size: 22px 22px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }
    .glow {
      position: fixed;
      width: 430px;
      height: 430px;
      border-radius: 50%;
      background: rgba(255, 178, 20, .08);
      filter: blur(90px);
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
    main {
      position: relative;
      width: min(100% - 36px, 850px);
      padding: 64px 28px 54px;
      text-align: center;
      animation: appear .9s ease both;
    }
    .logo-wrap {
      width: min(100%, 440px);
      margin: 0 auto 34px;
      filter: drop-shadow(0 16px 34px rgba(255, 150, 0, .14));
    }
    .logo {
      display: block;
      width: 100%;
      height: auto;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 20px;
      color: var(--gold-light);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    .eyebrow::before, .eyebrow::after {
      content: "";
      width: 25px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .eyebrow::after { transform: rotate(180deg); }
    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 8vw, 5.4rem);
      line-height: .98;
      letter-spacing: -.065em;
      font-weight: 900;
    }
    h1 span {
      display: block;
      color: var(--gold);
      text-shadow: 0 0 34px rgba(255, 183, 28, .2);
    }
    .intro {
      max-width: 540px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.12rem);
      line-height: 1.75;
    }
    .divider {
      width: 74px;
      height: 3px;
      margin: 34px auto 22px;
      border-radius: 5px;
      background: linear-gradient(90deg, var(--red), var(--gold), var(--orange));
      box-shadow: 0 0 18px rgba(255, 178, 20, .35);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #e8e1d2;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 5px rgba(255, 197, 47, .11), 0 0 15px var(--gold);
      animation: pulse 1.8s ease-in-out infinite;
    }
    footer {
      margin-top: 52px;
      color: #716d64;
      font-size: .72rem;
      letter-spacing: .08em;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      50% { opacity: .55; box-shadow: 0 0 0 8px rgba(255, 197, 47, .04), 0 0 8px var(--gold); }
    }
    @media (max-width: 520px) {
      main { padding: 42px 10px 34px; }
      .logo-wrap { width: min(88%, 360px); margin-bottom: 30px; }
      footer { margin-top: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
